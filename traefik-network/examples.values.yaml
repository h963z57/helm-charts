INBOUND_CONNECTION:
  - name: example-http
    type: http
    domain: app.example.org
    port: 8080
    entryPoints: [websecure]
    namespace: example-ns
    service: app-example-svc
    middlewaresPresents:
      - {name: basic-auth, secretName: example-basic-auth}
  - name: example-tcp
    type: tcp
    domain: tcp.example.org
    port: 9443
    entryPoints: [example-tcp]
    namespace: example-ns
    service: example-tcp-svc
    tls: passthrough
    proxyProtocol: 2
  - name: example-internal
    type: traefik
    domain: dashboard.example.org
    port: 8080
    entryPoints: [websecure]
    namespace: example-ns
    service: api@internal
