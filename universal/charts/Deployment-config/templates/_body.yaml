{{- define "deployment.body" -}}
{{- $splitNamespace := splitList "-" $.Release.Namespace }} 
{{- $filteredNamespace :=  without $splitNamespace "prod" "regress" "ift" "ift1" "ift2" "dev" "lt" "lt1" "lt2" "psi" "prom" "ns" }} 
{{- $editedNamespace := join "-" $filteredNamespace | lower  }}
{{- $checksLead := dict }}{{- range $value := $.Values.CONTAINERS }}{{- if $value.lead }}{{ $_ := set $checksLead "lead" $value.presetLabel }}{{- end }}{{- end }}
{{- range $index, $value := $.Values.CONTAINERS }}
  {{- if not (has $.Values.ENVIRONMENT $value.excludeStands) }}
# --== Create {{ $value.presetLabel }} pod ==--
{{- /* ======================== Конфигурация образа =========================== */}}
- name: {{ $value.presetLabel | lower }}-{{ $.Values.NAME }}-{{ $editedNamespace }}
  image: {{ index $.Values.IMAGE_PATHS $.Values.ENVIRONMENT }}/{{ index $.Values.IMAGES (upper $value.presetLabel) }}
  imagePullPolicy: Always
{{- /* ===================== ARGS $ COMMANDS  ============================= */}}
  {{- include "deployment.commands" (dict "Global" $ "presetLabel" $value.presetLabel ) | nindent 2 }}
  {{- include "deployment.args"     (dict "Global" $ "presetLabel" $value.presetLabel ) | nindent 2 }}
{{- /* ====================== ENVIRONMENTS ================================ */}}
  {{- include "deployment.environments" (dict "Global" $ "presetLabel" $value.presetLabel )    | nindent 2 }}
{{- /* ======================= HEALTHCHECK ================================ */}}
  {{- include "deployment.probes"    (dict "Global" $ "presetLabel" $value.presetLabel )       | nindent 2 }}
  {{- include "deployment.lifecycle" (dict "Global" $ "presetLabel" $value.presetLabel )       | nindent 2 }}
{{- /* ===================== SECURITY CONTEXT ============================= */}}
  {{- include "deployment.securityContext" (dict "Global" $ "presetLabel" $value.presetLabel ) | nindent 2 }}  
{{- /* ========================== PORTS =================================== */}}        
  {{- include "deployment.ports" (dict "Global" $ "presetLabel" $value.presetLabel )           | nindent 2 }}  
{{- /* ========================= HARDCODE ================================= */}}
  terminationMessagePath: /dev/termination-log
  terminationMessagePolicy: File
{{- /* ======================== RESOURCES ================================= */}}
  {{- include "deployment.resources" (dict "Global" $ "presetLabel" $value.presetLabel ) | nindent 2 }}
{{- /* ======================= VOLUMEMOUNTS =============================== */}}
  {{- $containersVolumes := dict }}
    {{- $containerVolumes := (concat
      (default (list) (index $.Values.VOLUME_MOUNTS (printf "default_%s" (upper $value.presetLabel)))) 
      (default (list) (index $.Values.VOLUME_MOUNTS (upper $value.presetLabel)))

      (default (list) (index $.Values.DCM (printf "default_%s" (upper $value.presetLabel)))) 
      (default (list) (index $.Values.DCM (upper $value.presetLabel)))
    )}}
    {{- range $containerVolume := $containerVolumes }}
      {{- $_ := set $containersVolumes $containerVolume.name $containerVolume }}
    {{- end }}
    {{- if gt (len $containersVolumes ) 0 }}
      {{- include "deployment.volumeMounts" (dict "Global" $ "volumeMounts" $containersVolumes "presetLabel" $value.presetLabel ) | nindent 2 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end -}}