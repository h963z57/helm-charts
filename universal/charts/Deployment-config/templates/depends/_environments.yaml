{{- define "deployment.environments" -}}
{{- $Global := .Global }}
{{- if gt (len (concat 
  (default (list) (index $Global.Values.ENVIRONMENTS "default")) 
  (default (list) (index $Global.Values.ENVIRONMENTS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.ENVIRONMENTS (upper .presetLabel)))
)) 0 }}
# --== Lib deploy environments ==--
env:
{{- range $index, $value := (concat 
  (default (list) (index $Global.Values.ENVIRONMENTS "default")) 
  (default (list) (index $Global.Values.ENVIRONMENTS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.ENVIRONMENTS (upper .presetLabel)))
)}}
  {{- if eq .type "text" }}
  - name: {{ $value.name }}
    value: "{{ tpl (toString $value.value) $Global }}"
  {{- else if eq .type "secret" }}
  - name: {{ $value.name }}
    valueFrom:
      secretKeyRef:
        name: {{ $value.name | toString | lower | replace "_" "-" }}-secret
        key: {{ $value.key }}
  {{- else if eq $value.type "fieldRef" }}
  - name: {{ $value.name }}
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: {{ toString $value.value }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}