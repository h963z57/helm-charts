{{- define "deployment.commands" -}}
{{- $Global := .Global }}
{{- if gt (len (concat 
  (default (list) (index $Global.Values.COMMANDS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.COMMANDS (upper .presetLabel)))
)) 0 }}
# --== Lib deploy commands ==--
command:
{{- range $index, $value := (concat 
  (default (list) (index $Global.Values.COMMANDS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.COMMANDS (upper .presetLabel)))
)}}
  - {{ $value }}
{{- end }}
{{- end }}
{{- end -}}