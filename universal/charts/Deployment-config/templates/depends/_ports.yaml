{{- define "deployment.ports" -}}
{{- $Global := .Global }}
# --== Lib deploy ports ==--
{{- if gt (len (concat 
  (default (list) (index $Global.Values.PORTS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.PORTS (upper .presetLabel)))
)) 0 }}
ports:
{{- range $index, $value := (concat 
  (default (list) (index $Global.Values.PORTS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.PORTS (upper .presetLabel)))
)}}
  - name: {{ $value.name }}
    containerPort: {{ $value.port }}
    protocol: {{ $value.protocol | upper }}
    {{- if $value.hostport }}
    hostPort: {{ $value.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end -}}
