{{- define "deployment.args" -}}
{{- $Global := .Global }}
{{- if gt (len (concat 
  (default (list) (index $Global.Values.ARGS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.ARGS (upper .presetLabel)))
)) 0 }}
# --== Lib deploy args ==--
args:
{{- range $index, $value := (concat 
  (default (list) (index $Global.Values.ARGS (printf "default_%s" (upper .presetLabel)))) 
  (default (list) (index $Global.Values.ARGS (upper .presetLabel)))
)}}
  - {{ $value }}
{{- end }}
{{- end }}
{{- end -}}