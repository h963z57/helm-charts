ENVIRONMENT: prod

IMAGE_PATHS:
  stand: <URL_REGISTRY>

SECURITYCONTEXT:
  default: |-
    capabilities: 
      drop:
        - ALL
    privileged: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false