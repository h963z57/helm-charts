PROBES:
  default_DJANGO: 
    readinessProbe: '{failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, tcpSocket: {port: 8000}, timeoutSeconds: 10}'
    livenessProbe : '{failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, tcpSocket: {port: 8000}, timeoutSeconds: 10}'
  default_PHP: 
    readinessProbe: '{exec: {command: ["/bin/sh", "-c", "curl -f http://localhost:80/ || exit 1"]}, failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, timeoutSeconds: 10}'
    livenessProbe:  '{exec: {command: ["/bin/sh", "-c", "curl -f http://localhost:80/ || exit 1"]}, failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, timeoutSeconds: 10}'
  default_GRAFANA:
    livenessProbe : '{httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30, timeoutSeconds: 5, periodSeconds: 10, failureThreshold: 3}'
    readinessProbe: '{httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10, timeoutSeconds: 5, periodSeconds: 10, failureThreshold: 3}'
  default_PROMETHEUS:
    livenessProbe : '{httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 30, timeoutSeconds: 5, periodSeconds: 10, failureThreshold: 3}'
    readinessProbe: '{httpGet: {path: /-/ready,   port: 9090}, initialDelaySeconds: 10, timeoutSeconds: 5, periodSeconds: 10, failureThreshold: 3}'
  default_REDIS:
    readinessProbe: '{failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, tcpSocket: {port: 6379}, timeoutSeconds: 10}'
    livenessProbe : '{failureThreshold: 3, initialDelaySeconds: 60, periodSeconds: 30, successThreshold: 1, tcpSocket: {port: 6379}, timeoutSeconds: 10}'

PORTS:
  default_DJANGO:
    - {name: http,       port: 8000,  protocol: TCP}
  default_PHP:
    - {name: http,       port: 80,    protocol: TCP}
  default_GRAFANA:
    - {name: http,       port: 3000,  protocol: TCP}
  default_PROMETHEUS:
    - {name: prometheus, port: 9090,  protocol: TCP}
  default_REDIS:
    - {name: redis,      port: 6379,  protocol: TCP}

RESOURCES:
  default_EXAMPLE:
