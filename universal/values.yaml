COMMANDS:
  default_EXAMPLE:
    - "/bin/sh"
    - "..."

ARGS:
  default_EXAMPLE:
    - "-c"
    - "-b"
    
ENVIRONMENTS:
  default_EXAMPLE:
    - {name: EXAMPLE, type: fieldRef, value: val  }
    - {name: EXAMPLE, type: text,     value: val  }
    - {name: EXAMPLE, type: fieldRef, value: val  }
    - {name: EXAMPLE, type: text,     value: "val"}

VOLUME_MOUNTS:
  default_EXAMPLE:
    - {name: example, mountPath: /destination/path, fieldRef: ["metadata.labels", "metadata.annotations"]                    }
    - {name: example, mountPath: /destination/path, serviceAccountToken: '{<body>}'                                          }
    - {name: example, mountPath: /destination/path, subPath: root-cert.pem, configMapName: existConfigMapName, noPrefix: true}
    - {name: example, mountPath: /destination/path, emptyDir: regular                                                        }
    - {name: example, mountPath: /destination/path, emptyDir: memory                                                         }



PROBES:
  default_EXAMPLE:
    livenessProbe:  '{failureThreshold: 3,   httpGet: {path: /actuator/health, port: 9080,  scheme: HTTP}, initialDelaySeconds: 90, periodSeconds: 30, successThreshold: 1, timeoutSeconds: 10 }'
    readinessProbe: '{failureThreshold: 3,   httpGet: {path: /actuator/health, port: 9080,  scheme: HTTP}, initialDelaySeconds: 90, periodSeconds: 30, successThreshold: 1, timeoutSeconds: 1  }'
    startupProbe:   '{failureThreshold: 300, httpGet: {path: /actuator/health, port: 9080,  scheme: HTTP}, initialDelaySeconds: 30, periodSeconds: 30, successThreshold: 1, timeoutSeconds: 1  }'

PORTS:
  default_EXAMPLE:
    - 1
    - 2
    - 3
    - 4


RESOURCES:
  default_EXAMPLE: { CPU_LIMIT: "", RAM_LIMIT: "", CPU_REQUESTS: "", RAM_REQUESTS: "" }

DCM:
  default_ASBS:
    - name: config-file
      mountPath: /app/il/tmp/conf
      configMapName: tomcat-cm
      subPath: web.xml
      content:
      - data: |-
          <body>

