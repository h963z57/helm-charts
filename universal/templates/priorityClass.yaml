{{- define "resources.priorityClass" -}}
{{- if $.Values.PRIORITY }}
{{- $checksLead := dict }}{{- range $container := $.Values.CONTAINERS }}{{- if $container.lead }}{{ $_ := set $checksLead "lead" $container.presetLabel }}{{- end }}{{- end }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ index $checksLead "lead" }}-{{ $.Values.NAME }}-pc
  labels:
    app.kubernetes.io/part-of  : {{ $.Release.Namespace }}
    app.kubernetes.io/component: app
value: {{ $.Values.PRIORITY.VALUE }}
globalDefault: false
---
{{- end }}
{{- end -}}