{{- define "configmaps.prometheus.config" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      {{- range $index, $value := $.Values.CONFIGMAPS.PROMETHEUS.HOSTS }}
      - job_name: '{{ $value.jobName }}'
        scrape_interval: 5s
        static_configs:
          {{- range $targetIndex, $target := $value.targets }}
          - targets: ['{{ $target.url }}']
            labels:
              instance: "{{ $target.labels }}"
          {{- end }}
      {{- end }}
{{- end -}}