{{- define "resources.ingress" -}}
{{- if .Values.PORTS }}
{{- range .Values.PORTS }}
{{- if .igwHttp }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $.Values.PROJECT_NAME }}-{{ .port }}-ingress
spec:
  entryPoints:
    - {{ .entryPoint }}
  routes:
  - match: Host(`{{ .igwHttp }}`)
    kind: Rule
    services:
    - name: {{ $.Values.PROJECT_NAME }}-svc
      port: {{ .port }}
    {{- if $.Values.MIDDLEWARES }}
    middlewares:
    {{- range $.Values.MIDDLEWARES }}
    - name: {{ . }}
    {{- end }}
    {{- end }}
  tls: {}
---
{{- else if .igwTCP }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ $.Values.PROJECT_NAME }}-{{ .port }}-ingress
spec:
  entryPoints:
    - {{ .entryPoint }}
  routes:
    {{- if .tls }}
    - match: HostSNI(`{{ .igwTCP }}`)
    {{- else }}
    - match: HostSNI(`*`)
    {{- end }}
      services:
        - name: {{ $.Values.PROJECT_NAME }}-svc
          port: {{ .port }}
          {{- if .proxyProtocol }}
          proxyProtocol:
            version: {{ .proxyProtocol }}
          {{- end }}
  {{- if .tls }}
  tls:
    passthrough: {{ .tls }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end -}}